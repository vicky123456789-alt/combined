<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CF Weakness Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-panel {
      margin-top: 15px;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid #BBBBBB;
      padding: 6px 8px;
      text-align: right;
    }
    .stats-table th {
      background-color: #E1E1E1;
      text-align: center;
      font-weight: bold;
      color: #333;
    }
    .stats-table tr:nth-child(even) {
      background-color: #F8F8F8;
    }
    .stats-table tr:hover {
      background-color: #F0F4FF;
    }
    .stats-table td:first-child {
      text-align: center;
    }
    .admin-actions {
      margin-bottom: 10px;
      padding: 10px;
      background: #F0F0F0;
      border: 1px solid #BBBBBB;
    }
  </style>
</head>
<body>

<!-- ── Navigation ───────────────────────────────────────────── -->
<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <div class="nav-logo"><a href="/dashboard.html">CF Weakness Tracker</a></div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="/dashboard.html">Dashboard</a></li>
      <li><a href="/charts.html">Weakness Charts</a></li>
      <li><a href="/compiler.html">Compiler</a></li>
      <li><a href="/subscription.html">Subscription</a></li>
      <li><a href="/profile.html">Profile</a></li>
      <li><a href="/admin.html" style="font-weight:bold; color:#CC0000;">Admin</a></li>
      <li><a href="#" id="logout-btn">Logout</a></li>
    </ul>
  </div>
</nav>

<!-- ── Main Content ─────────────────────────────────────────── -->
<div class="container">
  
  <div class="panel admin-panel">
    <div class="panel-title" style="background:#444; color:#FFF; border-bottom:1px solid #333;">System Administration</div>
    <div class="panel-body">
      
      <div class="admin-actions">
        <strong>Daily Statistics</strong>
        <span style="font-size:11px; color:#555; float:right;">Auto-updated via Edge Function Cron</span>
      </div>

      <div id="loading-msg" class="loading-text">Loading admin statistics...</div>
      <div id="error-msg" class="msg-error" style="display:none;"></div>

      <table class="stats-table" id="stats-table" style="display:none;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Total Users</th>
            <th>Active Subscribers</th>
            <th>Conversion Rate</th>
          </tr>
        </thead>
        <tbody id="stats-tbody">
          <!-- Rows will be injected here -->
        </tbody>
      </table>

    </div>
  </div>

</div>

<!-- ── Scripts ──────────────────────────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>`n<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>`n<script src="/js/firebase-client.js"></script>
<script src="/js/auth.js"></script>
<script>
(function() {
  'use strict';

  const ADMIN_EMAIL = 'vignesh7311379@gmail.com';
  let _session = null;

  window.addEventListener('DOMContentLoaded', async function() {
    _session = await Auth.initPage(true);
    if (!_session) return;

    // Client-side guard (Database RLS also guards this)
    if (_session.user.email !== ADMIN_EMAIL) {
      alert('Access Denied. You do not have admin privileges.');
      window.location.href = '/dashboard.html';
      return;
    }

    await loadStats();
  });

  async function loadStats() {
    const loading = document.getElementById('loading-msg');
    const errorBox = document.getElementById('error-msg');
    const table = document.getElementById('stats-table');
    const tbody = document.getElementById('stats-tbody');

    try {
      // Because we have RLS enabled and a specific policy for this email, 
      // we can query the table directly using the anon key + JWT.
      const { data, error } = await window._supabase
        .from('admin_stats')
        .select('*')
        .order('date', { ascending: false })
        .limit(30);

      if (error) throw error;

      loading.style.display = 'none';

      if (!data || data.length === 0) {
        errorBox.textContent = 'No statistics found in the database yet.';
        errorBox.className = 'msg-info';
        errorBox.style.display = 'block';
        return;
      }

      tbody.innerHTML = '';
      
      data.forEach(function(row) {
        const tr = document.createElement('tr');
        
        let convRate = '0.0%';
        if (row.total_users > 0) {
          convRate = ((row.active_subscribers / row.total_users) * 100).toFixed(1) + '%';
        }

        tr.innerHTML = `
          <td>${row.date}</td>
          <td>${row.total_users}</td>
          <td style="color:#008000; font-weight:bold;">${row.active_subscribers}</td>
          <td>${convRate}</td>
        `;
        tbody.appendChild(tr);
      });

      table.style.display = 'table';

    } catch (e) {
      loading.style.display = 'none';
      errorBox.textContent = 'Error loading stats: ' + e.message;
      errorBox.style.display = 'block';
    }
  }

})();
</script>
</body>
</html>
